{% extends './layouts/base_admin.html' %}

{% block content %}
<main class="w-full flex-grow p-6">
    <div class="w-full md:mt-12 md:mx-60">
        <div
            class="top-0 right-auto left-auto z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative place-self-auto w-full max-w-md max-h-full">
                <!-- Modal content -->
                <div class="relative bg-white rounded-lg shadow">
                    <!-- Modal header -->
                    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
                        <h3 class="text-lg font-semibold text-gray-900">
                            Créer un Produit
                        </h3>
                        <a href="{{url_for('admin_products')}}">
                            <button type="button"
                                class="text-white inline-flex items-center bg-gray-500 hover:bg-gray-600 focus:ring-4 focus:outline-none focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                                    viewBox="0 0 14 14">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                                </svg>
                                <div class="">Annuler</div>
                            </button>
                        </a>
                    </div>
                    <!-- Modal body -->
                    <form action="{{url_for('admin_products_add')}}" method="POST" enctype="multipart/form-data"
                        class="p-4 md:p-5">
                        <div class="grid gap-4 mb-4 grid-cols-4">
                            <div class="col-span-4">
                                <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Nom</label>
                                <input type="text" name="name" id="name"
                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"
                                    placeholder="Nom du Produit" required="">
                            </div>
                            <div class="col-span-4 sm:col-span-2">
                                <label for="category_id"
                                    class="block mb-2 text-sm font-medium text-gray-900">Catégorie</label>
                                <select id="category_id" name="category_id"
                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
                                    <option value="" selected="">Selectionner Catégorie</option>
                                    {% if categories %}
                                    {% for category in categories %}
                                    <option value="{{category.id}}">{{category.name}}</option>
                                    {% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                            <div class="col-span-4 sm:col-span-2">
                                <label for="group_id"
                                    class="block mb-2 text-sm font-medium text-gray-900">Groupe</label>
                                <select id="group_id" name="group_id"
                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
                                    <option value="" selected="">Selectionner groupe</option>
                                    {% if groups %}
                                    {% for group in groups %}
                                    <option value="{{group.id}}">{{group.name}}</option>
                                    {% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                            <div class="col-span-4 sm:col-span-2">
                                <label for="price" class="block mb-2 text-sm font-medium text-gray-900">Prix</label>
                                <input type="number" name="price" id="price"
                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"
                                    min=0.0 placeholder="0.0" required="">
                            </div>
                            <div class="col-span-4 sm:col-span-2">
                                <label for="active" class="block mb-2 text-sm font-medium text-gray-900">Statut</label>
                                <select id="active" name="active"
                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
                                    <option selected="">Selectionner état</option>
                                    <option value="True">Disponible</option>
                                    <option value="False">Indisponible</option>
                                </select>
                            </div>
                            <div class="col-span-4">
                                <label class="block mb-2 text-sm font-medium text-gray-900" for="image">Télécharger
                                    image du produit
                                </label>
                                <input
                                    class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50"
                                    id="image" name="image" type="file">
                            </div>
                            <div class="col-span-4">
                                <label for="description"
                                    class="block mb-2 text-sm font-medium text-gray-900">Description</label>
                                <textarea id="description" name="description" rows="4"
                                    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
                                    placeholder="Ecrivez la description du produit ici..."></textarea>
                            </div>
                        </div>
                        <button type="submit"
                            class="text-white inline-flex items-center bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:outline-none focus:ring-blue-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                            <svg class="w-6 h-6 text-gray-800 text-white" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 21a9 9 0 1 1 0-18c1.052 0 2.062.18 3 .512M7 9.577l3.923 3.923 8.5-8.5M17 14v6m-3-3h6" />
                            </svg>
                            Enrégistrer
                        </button>
                    </form>
                </div>
            </div>
        </div>
</main>
{% endblock %}
